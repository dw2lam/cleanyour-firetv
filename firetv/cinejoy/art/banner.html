<!doctype html>
<!-- Android TV / Fire TV banner (320x180 dp). Every size is in vw, so the same file renders natively at
     640x360 (xhdpi) and 960x540 (xxhdpi). Re-render with ./render.sh. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; font-weight: 800; src: url("fonts/Inter-ExtraBold.ttf") format("truetype"); }
  html, body { margin: 0; width: 100vw; height: 56.25vw; overflow: hidden; background: #050505; }
  .tile {
    position: relative; width: 100vw; height: 56.25vw; overflow: hidden;
    background:
      /* faint top sheen, like a tvOS tile */
      linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 38%),
      radial-gradient(120% 120% at 50% 40%, #0d0d0d 0%, #080808 55%, #050505 100%);
  }
  /* soft lime halo behind the mascot: it is what makes the logo's near-black outline read on a dark tile */
  .mark { position: relative; flex: none; }
  .glow {
    position: absolute; left: 50%; top: 56%; width: 78vw; height: 62vw;
    transform: translate(-50%, -50%); pointer-events: none;
    background:
      radial-gradient(closest-side, rgba(149,255,80,0.30) 0%, rgba(149,255,80,0.12) 30%, rgba(149,255,80,0) 52%),
      radial-gradient(closest-side, rgba(149,255,80,0.16) 0%, rgba(149,255,80,0.06) 55%, rgba(149,255,80,0) 100%);
  }
  .lockup {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 4.2vw;
    padding-right: 0.8vw; /* optical centring: the wordmark's right side is lighter than the mascot */
  }
  .mascot { position: relative; height: 25vw; width: auto; display: block; filter: drop-shadow(0 0.5vw 1.6vw rgba(0,0,0,0.55)); }
  .word {
    font-family: "Inter", sans-serif; font-weight: 800; font-size: 11.8vw; line-height: 1;
    letter-spacing: -0.035em; color: #fff; margin-top: 1.4vw;
    text-shadow: 0 0.4vw 1.6vw rgba(0,0,0,0.45);
  }
</style>
</head>
<body>
  <div class="tile">
    <div class="lockup">
      <div class="mark"><div class="glow"></div><img class="mascot" src="mascot.svg" alt=""></div>
      <div class="word">Cinejoy</div>
    </div>
  </div>
</body>
</html>
