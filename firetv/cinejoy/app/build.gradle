plugins {
    id 'com.android.application'
}

android {
    namespace 'online.davidlam.cinejoy'
    compileSdk 34

    defaultConfig {
        applicationId 'online.davidlam.cinejoy'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded, never published: debug key, so a release build installs over a debug one.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Plain Java + framework APIs only: no dependencies, so the APK stays tiny.
